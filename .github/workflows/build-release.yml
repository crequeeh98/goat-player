name: Build & Release GOATPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.0' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build apk --release --build-name="$VERSION"
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/GOATPlayer-universal.apk

      - name: Build Split per-ABI APKs (Fire TV & Phone)
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.0' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build apk --release --split-per-abi --build-name="$VERSION"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/GOATPlayer-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/GOATPlayer-arm64-v8a.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*
          retention-days: 7

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.0' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build windows --release --build-name="$VERSION"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'main') {
            $ver = "${{ github.event.inputs.release_tag }}".TrimStart('v')
          }
          if (-not $ver) { $ver = '2.0.0' }
          Set-Content -Path "build\windows\x64\runner\Release\version.txt" -Value $ver -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist/windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\windows\GOATPlayer-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: dist/windows/*
          retention-days: 7

  build-smart-tv:
    name: Build Smart TV Packages & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript Syntax
        run: |
          node -c smart_tv/js/*.js

      - name: Create Smart TV OTA Web Bundle & Manifest
        shell: bash
        run: |
          mkdir -p dist/smart_tv
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || 'v2.0.0' }}"
          fi
          
          # Generate version manifest for TV OTA Updater
          cat <<EOF > smart_tv/manifest.json
          {
            "version": "$VERSION",
            "releaseTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gitCommit": "${{ github.sha }}",
            "files": [
              "index.html",
              "css/style.css",
              "js/app.js",
              "js/player.js",
              "js/spatial_nav.js",
              "js/storage.js",
              "js/api.js",
              "js/m3u.js",
              "js/subtitles.js",
              "js/sync.js",
              "js/diagnostics.js",
              "js/i18n.js",
              "js/virtual_list.js",
              "js/updater.js"
            ]
          }
          EOF

          # Package Smart TV OTA zip bundle
          cd smart_tv
          zip -r ../dist/smart_tv/smart_tv_bundle.zip . -x ".*"
          cd ..
          cp smart_tv/manifest.json dist/smart_tv/smart_tv_manifest.json

      - name: Package LG webOS .ipk
        run: |
          npm install -g @webosose/ares-cli
          mkdir -p build/webos_staging
          cp -r smart_tv/* build/webos_staging/
          rm -f build/webos_staging/config.xml
          ares-package build/webos_staging -o dist/smart_tv
          rm -rf build/webos_staging

      - name: Upload Smart TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-tv-packages
          path: dist/smart_tv/*
          retention-days: 7

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-smart-tv]
    if: always() && !cancelled() && needs.build-windows.result == 'success' && needs.build-smart-tv.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: release_assets

      - name: Download Smart TV Artifacts
        uses: actions/download-artifact@v4
        with:
          name: smart-tv-packages
          path: release_assets

      - name: Determine Release Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.release_tag || 'v2.0.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "GOATPlayer Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ## 🐐 GOATPlayer v2.0.0 — The Cross-Platform IPTV & VOD Milestone

            ### 🇩🇪 Highlights (v2.0.0)
            - **Dual-Stack Architektur**: Vereinheitlichte Player-Logik über Flutter (Windows, Android Phone, Android TV, Amazon Fire TV) und Smart TV WebOS/Tizen.
            - **Amazon Fire TV & Android TV**: Vollständige Leanback-D-Pad-Steuerung, native 16:9 3D-Banner für Projectivy Launcher und optimierte 1:1 Fire OS Icons.
            - **Web Pairing Portal**: Schnelle Playlist-Verwaltung via QR-Code und PIN mit client-seitiger Zero-Knowledge AES-GCM Verschlüsselung ([goat-player.vercel.app](https://goat-player.vercel.app)).
            - **Live TV & Dual-Drawer Navigation**: Blitzschnelles Channel Zapping (<1s), EPG-Timeline und kompakte Sender- & Kategorie-Drawer.
            - **Cinema VOD**: Intelligente Continue-Watching Rail (automatische Episoden-Weiterschaltung ab 95%), Netflix-Style Episoden-Drawer und Multi-Track Audio-/Untertitel-Synchronisation.

            ### 🇬🇧 Highlights (v2.0.0)
            - **Dual-Stack Architecture**: Unified core streaming player logic across Flutter (Windows, Android Mobile/Tablet, Android TV, Fire TV) and Smart TV (LG webOS, Samsung Tizen).
            - **Amazon Fire TV & Android TV Optimization**: Full 4-way D-Pad remote navigation, native 16:9 3D banners for Projectivy Launcher, and tailored 1:1 Fire OS icons.
            - **Web Pairing Portal**: Effortless remote playlist management via QR code & PIN with Zero-Knowledge client-side AES-GCM encryption ([goat-player.vercel.app](https://goat-player.vercel.app)).
            - **Live TV & Dual-Drawer Navigation**: Sub-second channel zapping, interactive EPG timeline, and streamlined leanback drawers.
            - **Cinema VOD**: Smart Continue Watching rail (auto-advancing next episode at 95% completion), slide-out episode drawer, and multi-track audio/subtitle switching.
