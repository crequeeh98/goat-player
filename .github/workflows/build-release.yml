name: Build & Release GOATPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.0.2)'
        required: true
        default: 'v2.0.2'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/goat_keystore.jks
            echo "Release keystore restored from secrets."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.2' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build apk --release --build-name="$VERSION"
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/GOATPlayer-universal.apk

      - name: Build Split per-ABI APKs (Fire TV & Phone)
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.2' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build apk --release --split-per-abi --build-name="$VERSION"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/GOATPlayer-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/GOATPlayer-arm64-v8a.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*
          retention-days: 7

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.2' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build windows --release --build-name="$VERSION"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'main') {
            $ver = "${{ github.event.inputs.release_tag }}".TrimStart('v')
          }
          if (-not $ver) { $ver = '2.0.0' }
          Set-Content -Path "build\windows\x64\runner\Release\version.txt" -Value $ver -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist/windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\windows\GOATPlayer-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: dist/windows/*
          retention-days: 7

  build-smart-tv:
    name: Build Smart TV Packages & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript Syntax
        run: |
          node -c smart_tv/js/*.js

      - name: Create Smart TV OTA Web Bundle & Manifest
        shell: bash
        run: |
          mkdir -p dist/smart_tv
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || 'v2.0.0' }}"
          fi
          
          # Generate version manifest for TV OTA Updater
          cat <<EOF > smart_tv/manifest.json
          {
            "version": "$VERSION",
            "releaseTime": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "gitCommit": "${{ github.sha }}",
            "files": [
              "index.html",
              "css/style.css",
              "js/app.js",
              "js/player.js",
              "js/spatial_nav.js",
              "js/storage.js",
              "js/api.js",
              "js/m3u.js",
              "js/subtitles.js",
              "js/sync.js",
              "js/diagnostics.js",
              "js/i18n.js",
              "js/virtual_list.js",
              "js/updater.js"
            ]
          }
          EOF

          # Package Smart TV OTA zip bundle
          cd smart_tv
          zip -r ../dist/smart_tv/smart_tv_bundle.zip . -x ".*"
          cd ..
          cp smart_tv/manifest.json dist/smart_tv/smart_tv_manifest.json

      - name: Package LG webOS .ipk
        run: |
          npm install -g @webosose/ares-cli
          mkdir -p build/webos_staging
          cp -r smart_tv/* build/webos_staging/
          rm -f build/webos_staging/config.xml
          ares-package build/webos_staging -o dist/smart_tv
          rm -rf build/webos_staging

      - name: Auto-update webOS Homebrew Manifest
        shell: bash
        run: |
          IPK_FILE=$(ls dist/smart_tv/*.ipk | head -n 1)
          if [ -f "$IPK_FILE" ]; then
            IPK_NAME=$(basename "$IPK_FILE")
            IPK_SHA256=$(sha256sum "$IPK_FILE" | awk '{print $1}')
            IPK_SIZE=$(stat -c%s "$IPK_FILE")
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v[0-9] ]]; then
              TAG="${{ github.event.inputs.release_tag || 'v2.0.2' }}"
            fi
            RAW_VER="${TAG#v}"

            echo "Updating webOS manifest for $TAG ($IPK_NAME): SHA256=$IPK_SHA256, Size=$IPK_SIZE"

            node -e "
              const fs = require('fs');
              const path = 'webos-repo/apps.json';
              const manifest = {
                packages: [{
                  id: 'com.goatplayer.tv',
                  title: 'GOATPlayer TV',
                  iconUri: 'https://raw.githubusercontent.com/crequeeh98/goat-player/main/smart_tv/icon.png',
                  manifest: {
                    id: 'com.goatplayer.tv',
                    version: '$RAW_VER',
                    type: 'web',
                    title: 'GOATPlayer TV',
                    appDescription: 'Ultra-fast, premium IPTV player for Smart TV.',
                    iconUri: 'https://raw.githubusercontent.com/crequeeh98/goat-player/main/smart_tv/icon.png',
                    sourceUrl: 'https://github.com/crequeeh98/goat-player',
                    rootRequired: false,
                    ipkUrl: 'https://github.com/crequeeh98/goat-player/releases/download/$TAG/' + '$IPK_NAME',
                    ipkHash: {
                      sha256: '$IPK_SHA256'
                    },
                    ipkSize: Number('$IPK_SIZE')
                  },
                  pool: 'main',
                  requirements: {
                    webosRelease: '>=4.0'
                  },
                  shortDescription: 'Ultra-fast, premium IPTV player for Smart TV.'
                }]
              };
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
              if (fs.existsSync('portal/repo.json')) {
                fs.writeFileSync('portal/repo.json', JSON.stringify(manifest, null, 2) + '\n');
              }
            "

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add webos-repo/apps.json portal/repo.json || true
            git commit -m "chore(release): auto-update webos homebrew repo manifest for $TAG [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Upload Smart TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-tv-packages
          path: dist/smart_tv/*
          retention-days: 7

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-smart-tv]
    if: always() && !cancelled() && needs.build-windows.result == 'success' && needs.build-smart-tv.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: release_assets

      - name: Download Smart TV Artifacts
        uses: actions/download-artifact@v4
        with:
          name: smart-tv-packages
          path: release_assets

      - name: Determine Release Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.release_tag || 'v2.0.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "GOATPlayer Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ## 🐐 GOATPlayer v2.0.2

            ### 🇩🇪 Änderungen & Optimierungen (v2.0.2)
            - **7 TV RAM- & Performance-Optimierungen**:
              - *On-Demand Short-EPG*: Kein RAM-Vollabgleich beim Start; lädt on-demand ~10 Sendungen via `get_short_epg` (15 Min TTL).
              - *Virtual DOM Recycling*: Smart TV DOM-Knoten auf max. 30 Elemente begrenzt; Flutter Viewport-Caching optimiert.
              - *Lazy VOD Sync*: Serien- und Filmdetails laden erst beim Öffnen des Modals.
              - *XMLTV Isolate-Streaming*: Streaming großer EPG-Dateien in Chunks verhindert 150+ MB Heap-Spikes.
              - *Poster Image Memory Caching*: Thumbnail-Downscaling (`memCacheWidth`), Disk-Caching und Max 60 Heap-Decoder.
              - *Continue Watching Capping*: Verlauf und Abspielfortschritte auf 50 VOD-Einträge gecappt.
              - *Automatischer EPG-Prune*: Löscht abgelaufene EPG-Sendungen (>24h alt) beim App-Start aus SQLite.
            - **2 Sicherheits- & Updater-Härtungen**:
              - *Smart TV DOM XSS Härtung*: Alle dynamischen EPG-/Metadaten-Renderings nutzen strikt `textContent` oder HTML-Sanitization.
              - *Auto-Updater Integritätsprüfung*: HTTPS-GitHub-Restriktion, Path-Traversal-Schutz und SHA-256 Checksummenabgleich gegen `SHA256SUMS`.
            - **EPG & Info HUD Angleichung (Flutter)**:
              - *EPG Timezone-Fix*: Korrektes lokales Broadcast-String-Parsing verhindert 1h-UTC-Fehlversatz des Xtream-PHP-Servers ("JETZT" bleibt erhalten).
              - *Windows Kanalliste*: Sendungstitel und lila Fortschrittsbalken unter Sendernamen auf Desktop aktiviert.
              - *Info HUD Parität*: Windows nutzt nun im Vollbild das lange, lila Smart-IPTV Info HUD (wie Fire TV); Preview-Modus bleibt sauber ohne HUD.
              - *Player Schließen-Button*: Folgt nun exakt der erprobten `ESC`-Logik (beendet Vollbild sauber zurück zur Vorschau, kein Dashboard-Sprung).
              - *Fire TV Navigation & EPG-Schrift*: Reibungslose D-Pad-Navigation zurück zu Kategorien; EPG-Programmplan-Schriftgröße dezent verkleinert.
            - **Smart TV Brand Icons**: Textlose 1:1 Markenkachel und LG webOS Dock-Banner ohne Textabdrücke.

            ### 🇬🇧 Changes & Optimizations (v2.0.2)
            - **7 TV RAM & Performance Optimizations**:
              - *On-Demand Short EPG*: TV no longer downloads full EPG upfront; fetches ~10 shows via `get_short_epg` (15m TTL).
              - *Virtual DOM Recycling*: Smart TV DOM capped at 30 recycled elements; Flutter viewport caching fine-tuned.
              - *Lazy VOD Sync*: Series/movie details load on-demand when opening detail modal.
              - *XMLTV Isolate Streaming*: Chunked streaming parser prevents 150+ MB heap spikes.
              - *Poster Memory Caching*: Strict thumbnail downscaling (`memCacheWidth`), disk caching, and max 60 heap decoders.
              - *Continue Watching Capping*: History & playback progress capped at 50 VOD items.
              - *Auto EPG Pruning*: Prunes expired EPG listings (>24h old) from SQLite on launch.
            - **2 Security & Updater Hardening Fixes**:
              - *Smart TV DOM XSS Hardening*: All dynamic EPG and metadata rendering uses `textContent` or HTML sanitization.
              - *Auto-Updater Integrity Check*: Enforces HTTPS GitHub domains, blocks path traversal, and validates SHA-256 against `SHA256SUMS`.
            - **EPG & Info HUD Cross-Platform Parity (Flutter)**:
              - *EPG Timezone Fix*: Local broadcast string parsing prevents Xtream Codes PHP 1-hour UTC offset bug ("NOW" remains visible).
              - *Windows Channel List*: Added live show title and purple `LinearProgressIndicator` under channel names.
              - *Info HUD Parity*: Windows fullscreen playback now displays the full purple Smart-IPTV Info HUD (matching Fire TV); preview mode remains clean.
              - *Player Close Button*: Top-left Back button now mirrors `ESC` key behavior (exits fullscreen cleanly to preview without jumping to dashboard).
              - *Fire TV Navigation & EPG Typography*: Restored smooth D-Pad navigation to category column; subtly reduced EPG schedule font sizes for TV viewing.
            - **Smart TV Brand Icons*: Textless 1:1 brand tile and seamless LG webOS dock banner.
