name: Build & Release GOATPlayer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v2.0.4)'
        required: true
        default: 'v2.0.4'

permissions:
  contents: write

jobs:
  build-android:
    name: Build Android APKs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/goat_keystore.jks
            echo "Release keystore restored from secrets."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Universal APK
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.2' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build apk --release --build-name="$VERSION"
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-release.apk dist/android/GOATPlayer-universal.apk

      - name: Build Split per-ABI APKs (Fire TV & Phone)
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.2' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build apk --release --split-per-abi --build-name="$VERSION"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/GOATPlayer-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/GOATPlayer-arm64-v8a.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist/android/*
          retention-days: 7

  build-windows:
    name: Build Windows Desktop
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Windows Release
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || '2.0.2' }}"
            VERSION="${VERSION#v}"
          fi
          flutter build windows --release --build-name="$VERSION"

      - name: Package Windows ZIP
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          if (-not $ver -or $ver -eq 'main') {
            $ver = "${{ github.event.inputs.release_tag }}".TrimStart('v')
          }
          if (-not $ver) { $ver = '2.0.0' }
          Set-Content -Path "build\windows\x64\runner\Release\version.txt" -Value $ver -Encoding utf8
          New-Item -ItemType Directory -Force -Path dist/windows
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "dist\windows\GOATPlayer-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-bin
          path: dist/windows/*
          retention-days: 7

  build-smart-tv:
    name: Build Smart TV Packages & Web Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Check JavaScript Syntax
        run: |
          node -c smart_tv/js/*.js

      - name: Create Smart TV OTA Web Bundle & Manifest
        shell: bash
        run: |
          mkdir -p dist/smart_tv
          VERSION="${{ github.ref_name }}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then
            VERSION="${{ github.event.inputs.release_tag || 'v2.0.0' }}"
          fi
          
          # Generate cryptographic SHA-256 integrity manifest for TV OTA Bootloader & Updater
          node tool/generate_tv_manifest.js

          # Package Smart TV OTA zip bundle
          cd smart_tv
          zip -r ../dist/smart_tv/smart_tv_bundle.zip . -x ".*"
          cd ..
          cp smart_tv/manifest.json dist/smart_tv/smart_tv_manifest.json

      - name: Package LG webOS .ipk
        run: |
          npm install -g @webosose/ares-cli
          mkdir -p build/webos_staging
          cp -r smart_tv/* build/webos_staging/
          rm -f build/webos_staging/config.xml
          ares-package build/webos_staging -o dist/smart_tv
          rm -rf build/webos_staging

      - name: Auto-update webOS Homebrew Manifest
        shell: bash
        run: |
          IPK_FILE=$(ls dist/smart_tv/*.ipk | head -n 1)
          if [ -f "$IPK_FILE" ]; then
            IPK_NAME=$(basename "$IPK_FILE")
            IPK_SHA256=$(sha256sum "$IPK_FILE" | awk '{print $1}')
            IPK_SIZE=$(stat -c%s "$IPK_FILE")
            TAG="${{ github.ref_name }}"
            if [[ ! "$TAG" =~ ^v[0-9] ]]; then
              TAG="${{ github.event.inputs.release_tag || 'v2.0.2' }}"
            fi
            RAW_VER="${TAG#v}"

            echo "Updating webOS manifest for $TAG ($IPK_NAME): SHA256=$IPK_SHA256, Size=$IPK_SIZE"

            node -e "
              const fs = require('fs');
              const path = 'webos-repo/apps.json';
              const manifest = {
                packages: [{
                  id: 'com.goatplayer.tv',
                  title: 'GOATPlayer TV',
                  iconUri: 'https://raw.githubusercontent.com/crequeeh98/goat-player/main/smart_tv/icon.png',
                  manifest: {
                    id: 'com.goatplayer.tv',
                    version: '$RAW_VER',
                    type: 'web',
                    title: 'GOATPlayer TV',
                    appDescription: 'Ultra-fast, premium IPTV player for Smart TV.',
                    iconUri: 'https://raw.githubusercontent.com/crequeeh98/goat-player/main/smart_tv/icon.png',
                    sourceUrl: 'https://github.com/crequeeh98/goat-player',
                    rootRequired: false,
                    ipkUrl: 'https://github.com/crequeeh98/goat-player/releases/download/$TAG/' + '$IPK_NAME',
                    ipkHash: {
                      sha256: '$IPK_SHA256'
                    },
                    ipkSize: Number('$IPK_SIZE')
                  },
                  pool: 'main',
                  requirements: {
                    webosRelease: '>=4.0'
                  },
                  shortDescription: 'Ultra-fast, premium IPTV player for Smart TV.'
                }]
              };
              fs.writeFileSync(path, JSON.stringify(manifest, null, 2) + '\n');
              if (fs.existsSync('portal/repo.json')) {
                fs.writeFileSync('portal/repo.json', JSON.stringify(manifest, null, 2) + '\n');
              }
            "

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add webos-repo/apps.json portal/repo.json || true
            git commit -m "chore(release): auto-update webos homebrew repo manifest for $TAG [skip ci]" || true
            git push origin HEAD:main || true
          fi

      - name: Upload Smart TV Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: smart-tv-packages
          path: dist/smart_tv/*
          retention-days: 7

  publish-release:
    name: Create GitHub Release
    needs: [build-android, build-windows, build-smart-tv]
    if: always() && !cancelled() && needs.build-windows.result == 'success' && needs.build-smart-tv.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: android-apks
          path: release_assets

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-bin
          path: release_assets

      - name: Download Smart TV Artifacts
        uses: actions/download-artifact@v4
        with:
          name: smart-tv-packages
          path: release_assets

      - name: Determine Release Tag
        id: vars
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            TAG="${{ github.event.inputs.release_tag || 'v2.0.0' }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publish Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: "GOATPlayer Release ${{ steps.vars.outputs.tag }}"
          draft: false
          prerelease: false
          overwrite: true
          files: release_assets/*
          body: |
            ## 🐐 GOATPlayer v2.0.4

            ### 🇩🇪 Änderungen & Optimierungen (v2.0.4)
            - **Sicherheits- & Hardening-Suite**:
              - *Zero-Knowledge Remote Pairing*: Ende-zu-Ende AES-256-GCM Verschlüsselung bei QR-/PIN-Kopplung (PBKDF2 Schlüsselableitung). Playlisten und Zugangsdaten liegen auf Cloud-Brokern zu keinem Zeitpunkt im Klartext vor.
              - *Passwort-Verschlüsselung at Rest*: Zugangsdaten in lokaler SQLite (Flutter) und LocalStorage (Smart TV) per AES-GCM geschützt. Nahtlose automatische Migration aller bestehenden Accounts.
              - *Smart TV OTA Code-Integrität*: Dynamischer Bootloader validiert Code vor Ausführung strikt per kryptografischem SHA-256 Hash.
              - *Schutz vor Credential-Leaks in Logs*: Automatische Maskierung von Passwörtern und Parametern bei Netzwerk- und Verbindungsfehlern.
              - *Android Backup-Schutz*: Deaktiviertes OS-Backup (`allowBackup="false"`) verhindert Extraktion von Nutzerdaten über ADB.
              - *Berechtigungs-Minimalismus*: Unnötige System-Privilegien und Berechtigungen auf Tizen (`config.xml`) und webOS (`appinfo.json`) bereinigt.
              - *Automatischer Session-Cleanup*: Abgelaufene Kopplungssitzungen werden nach 10 Minuten serverseitig automatisch gelöscht.
            - **UI, Lokalisierung & Modernisierung**:
              - *Playlist-Aktualisieren Dialog*: Vollständig 1:1 auf Deutsch und Englisch übersetzt (relative Zeitstempel, Statusanzeigen, Buttons).
              - *Moderne Dialog-Icons*: Wiedergabe-Einstellungen modernisiert mit abgerundeten Material-Icons für Audiospur, Untertitel und Fertig-Aktion.
              - *Aktive Versionsanzeige*: Laufende App-Version wird nun direkt auf der Account-Übersicht auf allen Plattformen angezeigt.

            ### 🇬🇧 Changes & Optimizations (v2.0.4)
            - **Security & Hardening Suite**:
              - *Zero-Knowledge Remote Pairing*: End-to-end AES-256-GCM encryption for QR/PIN TV pairing. Credentials and playlist URLs are never stored in plaintext on third-party cloud brokers.
              - *Password Encryption at Rest*: Secret credentials encrypted with AES-GCM across SQLite (Flutter) and LocalStorage (Smart TV) with zero-breakage migration.
              - *Smart TV OTA Code Integrity*: Dynamic bootloader validates cached script integrity via SHA-256 before script injection.
              - *Credential Masking in Error Logs*: Passwords and sensitive parameters are stripped and masked in network error messages.
              - *Android Backup Hardening*: Explicitly disabled OS backup (`allowBackup="false"`) prevents extracting credentials via ADB backup.
              - *Privilege Minimization*: Stripped unused system permissions from Samsung Tizen (`config.xml`) and LG webOS (`appinfo.json`).
              - *Automated Session Cleanup*: Database trigger purges expired pairing sessions (>10 min) automatically.
            - **UI, Localization & Modernization**:
              - *Playlist Sync Modal*: Complete 1:1 localization in English and German (relative timestamps, status states, action buttons).
              - *Modernized Dialog Icons*: Playback settings dialog updated with sleek rounded Material icons for audio, subtitles, and done buttons.
              - *Active Version Badge*: Displays active running version on the Account management screen across all platforms.
