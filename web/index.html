<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="goat_player">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>goat_player</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Smart TV Remote Key Registration & Interception (Samsung Tizen & LG webOS)
    window.addEventListener('load', function() {
      // 1. Samsung Tizen Remote Key Registration
      if (window.tizen && window.tizen.tvinputdevice) {
        try {
          var tizenKeys = [
            'MediaPlay', 'MediaPause', 'MediaPlayPause', 'MediaStop',
            'MediaFastForward', 'MediaRewind',
            'ColorF0Red', 'ColorF1Green', 'ColorF2Yellow', 'ColorF3Blue',
            '1', '2', '3', '4', '5', '6', '7', '8', '9', '0'
          ];
          tizenKeys.forEach(function(keyName) {
            try {
              window.tizen.tvinputdevice.registerKey(keyName);
            } catch (e) {}
          });
        } catch (e) {}
      }

      // 2. Intercept LG webOS Back Key (keyCode 461) and Samsung Tizen Back Key (keyCode 10009)
      window.addEventListener('keydown', function(e) {
        if (e.keyCode === 461 || e.keyCode === 10009) {
          // Dispatch standard Escape key event to Flutter engine
          var event = new KeyboardEvent('keydown', {
            key: 'Escape',
            code: 'Escape',
            keyCode: 27,
            which: 27,
            bubbles: true,
            cancelable: true
          });
          document.dispatchEvent(event);
          e.preventDefault();
        }
      });
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
